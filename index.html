<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12prokes2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      background: linear-gradient(180deg, #050505, #111115, #1e1b24);
      background-attachment: fixed;
      overflow-x: hidden;
      position: relative;
    }/* Cetak biru grid effect */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
  animation: gridMove 15s linear infinite;
}

@keyframes gridMove {
  0% { transform: translateY(0); }
  100% { transform: translateY(40px); }
}

header {
  width: 100%;
  padding: 25px 0;
  text-align: center;
  font-size: 36px;
  font-weight: 700;
  font-family: 'Playfair Display', serif;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 5;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  animation: fadeDown 1s ease;
  background: linear-gradient(90deg, #d4af37, #fdfbfb, #d4af37);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 200% auto;
  animation: fadeDown 1s ease, shine 3s linear infinite;
}

@keyframes shine {
  to {
    background-position: 200% center;
  }
}

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.container {
  padding: 25px;
  position: relative;
  z-index: 3;
}

.foto-box {
  background: rgba(255,255,255,0.03);
  padding: 15px;
  border-radius: 18px;
  margin-bottom: 30px;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  border: 1px solid rgba(212, 175, 55, 0.3);
  transform: translateY(30px);
  opacity: 0;
  animation: fadeUp 1.3s ease forwards;
  transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
}

.foto-box:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 12px 40px rgba(212, 175, 55, 0.2);
  border-color: rgba(212, 175, 55, 0.7);
  z-index: 10;
}

.foto-box:nth-child(2) { animation-delay: 0.3s; }
.foto-box:nth-child(3) { animation-delay: 0.6s; }
.foto-box:nth-child(4) { animation-delay: 0.9s; }
.foto-box:nth-child(5) { animation-delay: 1.2s; }
.foto-box:nth-child(6) { animation-delay: 1.5s; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

.foto-box img {
  width: 100%;
  border-radius: 12px;
  display: block;
  animation: pop 0.6s ease;
  transition: transform 0.4s ease;
}

.foto-box:hover img {
  transform: scale(1.03);
}

@keyframes pop {
  from { transform: scale(0.95); }
  to { transform: scale(1); }
}

.caption {
  margin-top: 15px;
  font-size: 18px;
  font-weight: 300;
  letter-spacing: 1px;
  color: #f0e6d2;
  text-align: center;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}

/* Efek partikel bintang */
.stars {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: #ffd700;
  border-radius: 50%;
  opacity: 0.6;
  animation: blink 2s infinite ease-in-out;
  box-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
}

@keyframes blink {
  0% { opacity: 0.2; }
  50% { opacity: 1; }
  100% { opacity: 0.2; }
}

</style>
</head>
<body>  <div class="stars" id="stars"></div>  <header>12prokes2</header>  <div class="container"><div class="foto-box">
  <img src="IMG_20250925_133246.jpg" />
  <div class="caption">ketua baron dan wakil nya</div>
</div>

<div class="foto-box">
  <img src="IMG-20251104-WA0001.jpg" />
  <div class="caption">makan 😋</div>
</div>

<div class="foto-box">
  <img src="IMG-20250620-WA0046.jpg" />
  <div class="caption">gangster Mataram</div>
</div>

<div class="foto-box">
  <img src="IMG-20250809-WA0051.jpg" />
  <div class="caption">pemuda alim</div>
</div>
<div class="foto-box">
  <img src="IMG-20251025-WA0001.jpg" />
  <div class="caption">my bini</div>
</div>
  </div>  <script>
    const starContainer = document.getElementById("stars");
    for (let i = 0; i < 80; i++) {
      const s = document.createElement("div");
      s.classList.add("star");
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 100 + "%";
      s.style.animationDelay = (Math.random() * 2) + "s";
      starContainer.appendChild(s);
    }
  </script></body>
  </html>
